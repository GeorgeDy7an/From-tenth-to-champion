<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单节战术 · Quarter Lab</title>
<style>
:root{color-scheme:dark;--bg:#141818;--surface:#1d2424;--line:#41504e;--ink:#edf4ef;--muted:#b5c4bd;--mint:#a3edcc;--amber:#f5bd73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:20px 18px 34px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:26px;margin:0}h2{font-size:16px;margin:0 0 9px}h3{font-size:15px;margin:0}p{margin:0}small{color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);min-height:42px;padding:8px 12px}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}button[aria-pressed=true]{border-color:var(--mint);color:var(--mint);background:#203831}
header{padding:0 0 14px;border-bottom:1px solid var(--line)}.locale{display:flex;gap:4px}
.score{display:grid;grid-template-columns:1fr auto 1fr;text-align:center;align-items:center;gap:12px;padding:16px 0}
.score b{display:block;font-size:32px;font-variant-numeric:tabular-nums}.score .home b{color:var(--mint)}.score .away b{color:var(--amber)}
.arena{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:18px;align-items:start}
.court{display:block;width:100%;aspect-ratio:16/10;background:#293b36;border:1px solid #60766b;border-radius:5px}
.roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 0 0;padding:0;list-style:none;text-align:center}
.roster li{border-top:2px solid #75988a;padding:5px 0;background:var(--surface)}.roster b{display:block;font-size:18px}
.tactics{display:grid;gap:6px}.tactics button{display:grid;grid-template-columns:minmax(0,1fr) auto;text-align:left;align-items:center;gap:6px;width:100%}
.tactics small{font-variant-numeric:tabular-nums}strong{font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px 0}.stats b{display:block;color:var(--mint);font-size:20px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:7px;flex-wrap:wrap}.primary{background:var(--mint);color:#12231e;border-color:var(--mint);font-weight:700}
.timeline{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.strip{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.strip span{height:22px;border-radius:2px;background:#34403e;display:grid;place-items:center;font-size:11px}.strip .made{background:#a3edcc;color:#172c22}
.status{min-height:44px;padding-top:8px;color:var(--muted)}.seed{font-variant-numeric:tabular-nums}
@media(max-width:620px){.arena{grid-template-columns:1fr;gap:14px}.court{max-height:230px}.strip{grid-template-columns:repeat(10,minmax(0,1fr))}}
</style>
<main>
  <header><h1 data-label="title">单节战术</h1><div class="locale" role="group" aria-label="Language"><button id="zh" type="button" lang="zh-CN" aria-pressed="true">中文</button><button id="en" type="button" lang="en" aria-pressed="false">English</button></div></header>
  <section class="score" aria-label="Score">
    <div class="home"><span data-label="home">云港</span><b id="home-score">0</b></div>
    <small data-label="quarter">第一节</small>
    <div class="away"><span data-label="away">岩湾</span><b id="away-score">0</b></div>
  </section>
  <section class="arena">
    <div>
      <svg class="court" viewBox="0 0 480 300" role="img" aria-label="Half court">
        <g fill="none" stroke="#78938a" stroke-width="2">
          <path d="M18 18H462V282H18Z M180 18V137H300V18 M233 44H247 M205 32H275 M57 18V65C57 270 423 270 423 65V18"/>
          <circle cx="240" cy="137" r="45"/><circle cx="240" cy="44" r="8"/>
        </g>
        <polyline id="route" fill="none" stroke="#f5bd73" stroke-dasharray="6 6" stroke-width="3" points="112,213 190,170 240,60"/>
        <g fill="#a3edcc" stroke="#182823" stroke-width="3">
          <circle cx="112" cy="213" r="12"/><circle cx="190" cy="170" r="12"/><circle cx="352" cy="213" r="12"/><circle cx="306" cy="117" r="12"/><circle cx="208" cy="81" r="12"/>
        </g>
      </svg>
      <ul class="roster" id="roster" aria-label="Starting lineup"></ul>
    </div>
    <div>
      <h2 data-label="tactics">选择战术</h2>
      <div class="tactics" id="tactics" role="group" aria-label="Tactics"></div>
      <div class="stats">
        <div><small data-label="fit">阵容适配</small><b id="fit"></b></div>
        <div><small data-label="chance">出手命中率</small><b id="chance"></b></div>
      </div>
      <div class="actions"><button type="button" id="simulate" class="primary" data-label="simulate">模拟本节</button><button type="button" id="new-seed" data-label="newSeed">换一组样本</button></div>
    </div>
  </section>
  <section class="timeline">
    <div class="row"><h2 data-label="possessions">我方回合</h2><small class="seed"><span data-label="seed">种子</span> <span id="seed"></span></small></div>
    <div id="strip" class="strip" aria-hidden="true"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="quarter.js"></script>
<script>
'use strict';
const copy = {
  zh:{title:'单节战术',home:'云港',away:'岩湾',quarter:'第一节',tactics:'选择战术',fit:'阵容适配',chance:'出手命中率',simulate:'模拟本节',newSeed:'换一组样本',possessions:'我方回合',seed:'种子',drive:'突破分球',pick:'高位挡拆',perimeter:'外线强攻',idle:'尚未模拟',preview:'已更换战术，模拟后更新比分。',final:(a,b)=>'本节结束 · 云港 '+a+' : '+b+' 岩湾'},
  en:{title:'Quarter Lab',home:'Cloud Harbor',away:'Stone Bay',quarter:'Quarter 1',tactics:'Call a tactic',fit:'Lineup fit',chance:'Shot chance',simulate:'Simulate quarter',newSeed:'New sample',possessions:'Home possessions',seed:'Seed',drive:'Drive and kick',pick:'High pick and roll',perimeter:'Perimeter attack',idle:'No simulation yet',preview:'New tactic selected. Simulate to update the score.',final:(a,b)=>'Quarter complete · Cloud Harbor '+a+' : '+b+' Stone Bay'}
};
const routes = {drive:'112,213 190,170 240,60',pick:'190,170 232,135 208,81 240,52',perimeter:'112,213 190,170 352,213'};
const $ = id => document.getElementById(id);
let language = 'zh', seed = 3581, selection = 'pick', result = null, played = null;
function render() {
  const text = copy[language];
  document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-label]').forEach(node => { node.textContent = text[node.dataset.label]; });
  for (const key of ['zh','en']) $(key).setAttribute('aria-pressed', key === language);
  const preview = QuarterDemo.simulate(selection, seed);
  $('fit').textContent = preview.fit + ' / 5';
  $('chance').textContent = (preview.chance * 100).toFixed(1) + '%';
  $('route').setAttribute('points', routes[selection]);
  $('seed').textContent = seed;
  $('home-score').textContent = result?.home ?? 0;
  $('away-score').textContent = result?.away ?? 0;
  $('status').textContent = !result ? text.idle : played !== selection ? text.preview : text.final(result.home,result.away);
  for (const button of $('tactics').children) {
    const key = button.dataset.tactic;
    button.firstChild.textContent = text[key];
    button.setAttribute('aria-pressed', key === selection);
  }
  $('strip').replaceChildren(...Array.from({length:20}, (_,i) => {
    const cell = document.createElement('span');
    const points = result?.plays[i].home || 0;
    if (points) { cell.className = 'made'; cell.textContent = points; }
    return cell;
  }));
}
for (const [i, rating] of QuarterDemo.lineup.entries()) {
  const slot = document.createElement('li'), pos = document.createElement('small'), number = document.createElement('b');
  pos.textContent = ['PG','SG','SF','PF','C'][i];
  number.textContent = rating;
  slot.append(pos, number); $('roster').append(slot);
}
for (const key of Object.keys(QuarterDemo.tactics)) {
  const button = document.createElement('button'), name = document.createElement('strong'), fit = document.createElement('small');
  button.type = 'button'; button.dataset.tactic = key;
  fit.textContent = QuarterDemo.tactics[key].fit + ' / 5';
  button.append(name,fit);
  button.onclick = () => { selection = key; render(); };
  $('tactics').append(button);
}
$('simulate').onclick = () => { result = QuarterDemo.simulate(selection, seed); played = selection; render(); };
$('new-seed').onclick = () => { seed = (seed + 7919) >>> 0; result = null; played = null; render(); };
for (const key of ['zh','en']) $(key).onclick = () => { language = key; render(); };
render();
</script>
</html>
